services:
  - type: web
    name: carteira-micro-egi-3x
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NTFY_SERVER
        value: https://ntfy.sh
      - key: NTFY_TOPIC
        sync: false
